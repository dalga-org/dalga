[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dalga-core"
version = "0.1.0"
description = "A blazing fast, Rust-backed streaming data profiler."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "fastapi>=0.136.1",
    "pandas>=3.0.3",
    "polars>=0.20.0",
    "uvicorn>=0.46.0",
    "psutil>=5.9.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src/python"
module-name = "dalga.dalga"

[tool.ruff]
line-length = 100
target-version = "py311"
