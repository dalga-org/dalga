[package]
name = "dalga"
version = "0.1.0"
edition = "2021"

[lib]
name = "dalga"
crate-type = ["cdylib"] 

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "1.1" 
hyperloglogplus = "0.4.1"
arc-swap = "1.7"
dashmap = "5.5"
parking_lot = "0.12"
